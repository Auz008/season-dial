<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A quiet miniature world suspended between the seasons. A golden hand, two little cats, and the passage of time.">
<meta name="theme-color" content="#030609"><title>Season Dial</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2305080b' stroke='%23c8b47e'/%3E%3Cpath d='M32 32L48 15' stroke='%23e5d5a4' stroke-width='2'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030609;color:#e8e6dc;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}button{border:0;background:transparent;color:#aab1a9;padding:9px;cursor:pointer;font:inherit;letter-spacing:.06em}button:hover,button[aria-pressed=true]{color:#f0dbab}button:focus-visible,input:focus-visible{outline:1px solid #e9d39e;outline-offset:4px}footer{position:fixed;z-index:3;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:7px 14px;background:#07101191;border:1px solid #bcbda51a;border-radius:40px;backdrop-filter:blur(18px);white-space:nowrap;transition:opacity 1s,transform 1s}body.idle footer{opacity:0;transform:translate(-50%,10px);pointer-events:none}footer:focus-within,body.idle footer:hover{opacity:1;transform:translate(-50%,0);pointer-events:auto}#play{width:38px;border-right:1px solid #ffffff18}input{accent-color:#cbbd8b;width:85px;height:2px}#time{font-size:9px;color:#92988c;min-width:34px}.divider{height:15px;width:1px;background:#ffffff18}#error{position:fixed;inset:35% 15%;display:none;line-height:2;text-align:center;color:#bec5c2}#reference-dialog{background:#030609;color:#ddd;border:1px solid #ffffff20;border-radius:12px;max-width:96vw;padding:10px}#reference-dialog::backdrop{background:#020508eb;backdrop-filter:blur(12px)}#reference-dialog img{display:block;max-width:90vw;max-height:82vh}#reference-dialog p{text-align:center;color:#8b9697;font-size:10px;letter-spacing:1px}body.clean footer{display:none}#artwork{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#020408;display:none}body.art-mode #artwork{display:block}body.art-mode #scene{visibility:hidden}body.art-mode .live-only{display:none}#mode{min-width:72px}@media(max-width:650px){footer{gap:4px;padding:6px 9px;bottom:16px}button{padding:9px 6px;font-size:10px}input{width:50px}#time,.optional{display:none}}@media(max-width:420px){footer{gap:2px;max-width:calc(100vw - 16px)}#seasons button{font-size:0;padding:9px 7px}#seasons button::after{content:attr(data-short);font-size:10px}#timeline{display:none}#mode{min-width:61px}}@media(prefers-reduced-motion:reduce){footer{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="A seasonal meadow dial floating in the stars, with two cats and a golden wheat hand"></canvas>
<img id="artwork" src="./reference-render.png" alt="Season Dial: a generated artwork of a floating autumn, green and snow meadow with two cats">
<dialog id="reference-dialog"><button id="close-reference" style="float:right" aria-label="Close artwork">Close &times;</button><img src="./reference-render.png" alt="The generated visual reference for this project"><p>ARTWORK REFERENCE</p></dialog>
<footer aria-label="Scene controls">
<button id="play" class="live-only" aria-label="Pause">Ⅱ</button>
<div id="seasons" class="live-only"><button data-season="0" aria-label="Spring" data-short="Sp">Spring</button><button data-season="1" aria-label="Summer" data-short="Su">Summer</button><button data-season="2" aria-label="Autumn" data-short="Au">Autumn</button><button data-season="3" aria-label="Winter" data-short="Wi">Winter</button></div>
<input id="timeline" class="live-only" aria-label="Season progress" type="range" min="0" max="3.999" value="0" step="0.001">
<span id="time" class="live-only">Spring</span>
<button id="speed" class="live-only optional" aria-label="Playback speed">1×</button><button id="reset" class="live-only optional" aria-label="Reset camera">↺</button>
<span class="divider"></span><button id="mode" aria-label="Switch to artwork">Artwork</button><button id="reference" class="optional" aria-label="Open reference image">↗</button><button id="full" aria-label="Fullscreen">⛶</button>
</footer>
<div id="error" role="status"></div>
<script src="./interface.js"></script><script type="module" src="./scene.js"></script>
</body></html>
